function el(t,a={},p){const e=document.createElementNS('http://www.w3.org/2000/svg',t);
 for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function css(n){return getComputedStyle(document.querySelector('.viz')).getPropertyValue(n).trim()}
function fmt(v,d=2){return v==null?'–':(+v).toFixed(d)}
const tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip);
function showTip(html,x,y){tip.innerHTML=html;tip.style.display='block';
 const r=tip.getBoundingClientRect();
 tip.style.left=Math.min(x+14,innerWidth-r.width-8)+'px';
 tip.style.top=Math.max(8,y-r.height-10)+'px'}
function hideTip(){tip.style.display='none'}
function axisY(g,x0,x1,y0,y1,vmax){
 const n=4;for(let i=0;i<=n;i++){const v=vmax*i/n,y=y1-(y1-y0)*i/n;
  el('line',{x1:x0,y1:y,x2:x1,y2:y,stroke:css('--grid'),'stroke-width':1},g);
  const t=el('text',{x:x0-6,y:y+4,'text-anchor':'end','font-size':10,fill:css('--muted')},g);
  t.textContent=v>=10?v.toFixed(0):v.toFixed(1)}}

const houses=Object.keys(DATA);
let cur=houses[0],selDay=24;
const fS=document.getElementById('fSplit'),fT=document.getElementById('fType'),fH=document.getElementById('fHouse');
function pool(){return houses.filter(h=>(!fS.value||DATA[h].split===fS.value)&&(!fT.value||DATA[h].type===fT.value))}
function fillSel(){const p=pool();fH.innerHTML=p.map(h=>`<option value="${h}">${h.replace('house_','가구 ')}${DATA[h].split==='cold'?' ◇':''}</option>`).join('');
 if(!p.includes(cur))cur=p[0];fH.value=cur}
function tiles(){const d=DATA[cur];document.getElementById('tiles').innerHTML=
 [['가구',cur.replace('house_','#')+(d.split==='cold'?' (콜드스타트)':' (학습)')],
  ['가구 유형',d.type],['주거 면적',d.area],['측정 채널',d.nch+'개'],
  ['일평균 사용량',d.daily_avg+' kWh'],['측정 시작',d.start]]
 .map(([k,v])=>`<div class="tile"><div class="k">${k}</div><div class="v" style="font-size:15px">${v}</div></div>`).join('')}
function daily(){const d=DATA[cur],W=Math.max(640,Math.min(innerWidth-80,980)),H=180,x0=44,y1=H-24;
 const tot=[];for(let i=0;i<31;i++){let s=0;for(let j=0;j<24;j++)s+=d.y[i*24+j];tot.push(s)}
 const vmax=Math.max(...tot)*1.08||1;
 const host=document.getElementById('daily');host.innerHTML='';
 const svg=el('svg',{width:W,height:H},host);axisY(svg,x0,W-8,10,y1,vmax);
 const bw=(W-8-x0)/31;
 tot.forEach((v,i)=>{const bh=(v/vmax)*(y1-10),x=x0+i*bw;
  const r=el('rect',{x:x+1,y:y1-bh,width:bw-2,height:Math.max(bh,1),rx:3,
   fill:i>=24?css('--s2'):css('--s1'),opacity:i===selDay?1:.72,cursor:'pointer'},svg);
  r.addEventListener('mousemove',e=>showTip(`<b>${i+1}일차</b>${i>=24?' · 테스트':''}<br>총 ${fmt(v)} kWh`,e.clientX,e.clientY));
  r.addEventListener('mouseleave',hideTip);
  r.addEventListener('click',()=>{selDay=i;render(false)});
  if(i%5===0){const t=el('text',{x:x+bw/2,y:H-8,'text-anchor':'middle','font-size':10,fill:css('--muted')},svg);t.textContent=(i+1)+'일'}});
 el('line',{x1:x0,y1:y1,x2:W-8,y2:y1,stroke:css('--axis')},svg)}
function hourly(){const d=DATA[cur],W=Math.max(640,Math.min(innerWidth-80,980)),H=220,x0=44,y1=H-26;
 const ys=d.y.slice(selDay*24,selDay*24+24),vmax=Math.max(...ys)*1.15||1;
 document.getElementById('hTitle').textContent=`시간별 사용량 — ${selDay+1}일차${selDay>=24?' (테스트 구간)':''} (kWh)`;
 const host=document.getElementById('hourly');host.innerHTML='';
 const svg=el('svg',{width:W,height:H},host);axisY(svg,x0,W-8,12,y1,vmax);
 const X=i=>x0+(W-8-x0)*i/23,Y=v=>y1-(v/vmax)*(y1-12);
 el('path',{d:ys.map((v,i)=>(i?'L':'M')+X(i)+','+Y(v)).join(''),fill:'none',
  stroke:css('--s1'),'stroke-width':2,'stroke-linejoin':'round'},svg);
 for(let i=0;i<24;i+=3){const t=el('text',{x:X(i),y:H-8,'text-anchor':'middle','font-size':10,fill:css('--muted')},svg);t.textContent=i+'시'}
 el('line',{x1:x0,y1:y1,x2:W-8,y2:y1,stroke:css('--axis')},svg);
 const guide=el('line',{y1:12,y2:y1,stroke:css('--axis'),'stroke-dasharray':'3 3',visibility:'hidden'},svg);
 const dot=el('circle',{r:4,fill:css('--s1'),stroke:css('--surface'),'stroke-width':2,visibility:'hidden'},svg);
 const cap=el('rect',{x:x0,y:0,width:W-8-x0,height:H,fill:'transparent'},svg);
 cap.addEventListener('mousemove',e=>{const b=svg.getBoundingClientRect();
  const i=Math.max(0,Math.min(23,Math.round((e.clientX-b.left-x0)/((W-8-x0)/23))));
  guide.setAttribute('x1',X(i));guide.setAttribute('x2',X(i));guide.setAttribute('visibility','visible');
  dot.setAttribute('cx',X(i));dot.setAttribute('cy',Y(ys[i]));dot.setAttribute('visibility','visible');
  showTip(`<b>${selDay+1}일차 ${i}시</b><br>${fmt(ys[i],3)} kWh`,e.clientX,e.clientY)});
 cap.addEventListener('mouseleave',()=>{guide.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden');hideTip()})}
function table(){const d=DATA[cur];let rows='';
 for(let i=0;i<31;i++){let s=0,mx=0;for(let j=0;j<24;j++){s+=d.y[i*24+j];mx=Math.max(mx,d.y[i*24+j])}
  rows+=`<tr><td>${i+1}일차${i>=24?' (테스트)':''}</td><td>${fmt(s)}</td><td>${fmt(s/24,3)}</td><td>${fmt(mx,3)}</td></tr>`}
 document.getElementById('tblBody').innerHTML=`<table><tr><th>일</th><th>총량 kWh</th><th>시간평균</th><th>시간최대</th></tr>${rows}</table>`}
function render(reset=true){if(reset)selDay=24;fillSel();tiles();daily();hourly();table()}
fS.onchange=fT.onchange=()=>{render()};fH.onchange=()=>{cur=fH.value;render()};
document.getElementById('prev').onclick=()=>{const p=pool(),i=p.indexOf(cur);cur=p[(i-1+p.length)%p.length];render()};
document.getElementById('next').onclick=()=>{const p=pool(),i=p.indexOf(cur);cur=p[(i+1)%p.length];render()};
document.getElementById('tbl').onclick=e=>{const c=document.getElementById('tblCard');
 const on=c.style.display==='none';c.style.display=on?'':'none';e.target.classList.toggle('on',on)};
